<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TEST VIDEO</title>
<style>
  body { background:#000; color:#fff; font-family: Arial, sans-serif; margin:0; padding:16px; }
  h1 { font-size: 22px; margin: 0 0 10px 0; }
  .row { margin-bottom: 10px; padding: 8px; border: 1px solid #333; border-radius: 6px; }
  .t { font-size: 18px; font-weight: bold; }
  .s { font-size: 20px; color: #22d3ee; }
  .e { font-size: 20px; color: #ff5555; }
  video { width: 240px; height: 135px; background:#111; }
</style>
</head>
<body>
<h1>TEST DE VIDEO - TV</h1>

<div class="row">
  <div class="t">1) HLS (.m3u8) — France 24</div>
  <div class="s" id="s1">probando…</div>
  <video id="v1" muted playsinline></video>
</div>

<div class="row">
  <div class="t">2) MP4 — prueba</div>
  <div class="s" id="s2">probando…</div>
  <video id="v2" muted playsinline></video>
</div>

<script>
function watch(v, label, el) {
  var t0 = Date.now();
  v.addEventListener('playing', function () { el.className='s'; el.textContent = 'ANDUVO'; });
  v.addEventListener('loadeddata', function () { el.className='s'; el.textContent = 'cargó datos'; });
  v.addEventListener('error', function () {
    el.className='e';
    el.textContent = 'ERROR codigo ' + (v.error ? v.error.code : '?');
  });
  setTimeout(function () {
    if (el.textContent === 'probando…') {
      el.className='e';
      el.textContent = 'SIN RESPUESTA (readyState ' + v.readyState + ')';
    }
  }, 12000);
}

var v1 = document.getElementById('v1');
v1.src = 'https://static.france24.com/live/F24_EN_LO_HLS/live_web.m3u8';
v1.play().catch(function(){});
watch(v1, 'hls', document.getElementById('s1'));

var v2 = document.getElementById('v2');
v2.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4';
v2.play().catch(function(){});
watch(v2, 'mp4', document.getElementById('s2'));
</script>
</body>
</html>
