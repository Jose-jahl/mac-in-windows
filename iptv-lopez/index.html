<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>IPTV LOPEZ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: #07090d;
  color: #e8edf4;
  font-family: "LG Smart UI", "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.hidden { display: none; }

#app { display: flex; width: 100%; height: 100%; }

/* ---------------- sidebar ---------------- */
#side {
  width: 236px;
  min-width: 236px;
  -webkit-flex: 0 0 236px;
  flex: 0 0 236px;
  height: 100%;
  background: #0a0d12;
  border-right: 1px solid #13181f;
  display: flex;
  flex-direction: column;
}

#brand {
  display: flex;
  align-items: center;
  padding: 20px 18px 16px 18px;
  border-bottom: 1px solid #12171e;
}
#brand .mark {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: -webkit-linear-gradient(top, #2ee6ff, #0e8fa6);
  background: linear-gradient(top, #2ee6ff, #0e8fa6);
  box-shadow: 0 0 16px rgba(34, 211, 238, .45);
  margin-right: 11px;
  position: relative;
}
#brand .mark:after {
  content: "";
  position: absolute;
  left: 11px; top: 9px;
  width: 0; height: 0;
  border-left: 9px solid #04131a;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}
#brand .b1 { font-size: 15px; letter-spacing: 4px; color: #cfd9e4; font-weight: 300; line-height: 1.15; }
#brand .b2 { font-size: 15px; letter-spacing: 4px; color: #22d3ee; font-weight: 700; line-height: 1.15; }

#tabs { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 8px 0 10px 0; }

.sect {
  padding: 14px 18px 5px 18px;
  font-size: 9px;
  letter-spacing: 2.4px;
  color: #414b59;
  font-weight: 700;
}

.tab {
  padding: 9px 18px;
  font-size: 13px;
  color: #94a1b2;
  border-left: 3px solid transparent;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tab.on {
  color: #ffffff;
  background: #0e2a33;
  border-left-color: #22d3ee;
  font-weight: 600;
}
.tab.focus { background: #1b2833; color: #ffffff; border-left-color: #ffffff; }
.tab .n { float: right; font-size: 10px; color: #56657a; padding-left: 6px; }

#sidenote {
  padding: 10px 18px 14px 18px;
  font-size: 9.5px;
  letter-spacing: 1.4px;
  color: #35404e;
  border-top: 1px solid #12171e;
}

/* ---------------- main ---------------- */
#main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }

#head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 20px 34px 8px 34px;
}
#title { font-size: 25px; font-weight: 700; letter-spacing: -.4px; color: #f2f6fb; }
.meta span { font-size: 11px; color: #66748a; letter-spacing: 1px; margin-left: 16px; }
#status { color: #22d3ee; }

#grid {
  position: relative;
  flex: 1 1 auto;
  padding: 6px 34px 0 34px;
  overflow: hidden;
}

.card {
  position: relative;
  display: inline-block;
  vertical-align: top;
  margin: 0 12px 10px 0;
  padding: 9px 12px;
  height: 76px;
  border-radius: 10px;
  background: #0f141b;
  border: 1px solid #19202a;
  overflow: hidden;
}

.card .logo {
  display: inline-block;
  vertical-align: middle;
  width: 46px; height: 46px;
  border-radius: 9px;
  background: #161c25;
  object-fit: contain;
  margin-right: 11px;
}
.card .ph {
  display: inline-block;
  vertical-align: middle;
  width: 46px; height: 46px;
  line-height: 46px;
  border-radius: 9px;
  background: #12252c;
  color: #35cfe6;
  font-size: 19px;
  font-weight: 700;
  text-align: center;
  margin-right: 11px;
}
.card .txt { display: inline-block; vertical-align: middle; width: 66%; }
.card .nm {
  font-size: 13.5px; color: #e4ebf3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card .gr {
  font-size: 9.5px; color: #5a687c; letter-spacing: 1.2px;
  text-transform: uppercase; margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card .fav {
  position: absolute; top: 7px; right: 9px;
  font-size: 11px; color: #f5c518; display: none;
}
.card.is-fav .fav { display: block; }

.card.focus {
  background: -webkit-linear-gradient(top, #123542, #0d2530);
  background: linear-gradient(top, #123542, #0d2530);
  border-color: #22d3ee;
  box-shadow: 0 0 0 2px #22d3ee, 0 0 26px rgba(34, 211, 238, .22);
}
.card.focus .nm { color: #ffffff; }
.card.focus .gr { color: #7fd8e6; }

.empty {
  padding: 90px 0 0 0;
  text-align: center;
  color: #5a687c;
  font-size: 14px;
  letter-spacing: .5px;
}

.spinner {
  display: inline-block;
  width: 18px; height: 18px;
  border: 2px solid #1e2a36;
  border-top-color: #22d3ee;
  border-radius: 50%;
  vertical-align: -3px;
  margin-right: 9px;
  -webkit-animation: spin .8s linear infinite;
  animation: spin .8s linear infinite;
}
@-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
@keyframes spin { to { transform: rotate(360deg); } }

#hints {
  flex: 0 0 auto;
  padding: 8px 34px 10px 34px;
  font-size: 10.5px;
  color: #4e5b6d;
  letter-spacing: 1px;
  border-top: 1px solid #10151c;
}
#hints span { margin-right: 20px; }
#hints b { color: #22d3ee; font-weight: 700; }

/* ---------------- player ---------------- */
#player {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #000000;
}
#video { display: block; width: 100%; height: 100%; background: #000000; }

#osd {
  position: absolute;
  left: 46px; bottom: 40px;
  padding: 11px 16px;
  border-radius: 9px;
  background: #060a0e;
  border: 1px solid #1e2530;
  max-width: 62%;
  opacity: 1;
}
#osd.fade { opacity: 0; }
.osd-name { font-size: 19px; font-weight: 700; }
.osd-state { font-size: 11px; color: #8b99ab; margin-top: 4px; letter-spacing: 1.2px; }

#perr {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #000000;
  text-align: center;
  padding-top: 300px;
}
#perr p { font-size: 17px; color: #e8edf4; }
#perr .small { font-size: 11px; color: #6f7d90; margin-top: 8px; }

/* ---------- modo navegador (TV Browser / web) ---------- */
body.web, body.web html { overflow: auto; height: auto; }
body.web #app { display: block; height: auto; }
body.web #side {
  width: auto; min-width: 0; height: auto;
  display: block; border-right: 0; border-bottom: 1px solid #13181f;
}
body.web #brand { display: inline-block; padding: 12px 16px; border: 0; vertical-align: middle; }
body.web #tabs { display: block; padding: 0 12px 10px 12px; overflow: visible; min-height: 0; }
body.web .sect { display: none; }
body.web .tab {
  display: inline-block; margin: 0 6px 6px 0; padding: 6px 12px;
  border: 1px solid #1e2530; border-left: 1px solid #1e2530; border-radius: 14px;
}
body.web .tab.on { border-color: #22d3ee; background: #0e2a33; }
body.web #main { display: block; }
body.web #grid { overflow: visible; height: auto; padding: 10px 24px 60px 24px; }
body.web .card { cursor: pointer; }
body.web #hints, body.web #sidenote { display: none; }


</style>
</head>

  }

    }
    for (i = 0; i < GENRES.length; i++) {
      tabs.push({ id: 'g_' + GENRES[i][0], label: GENRES[i][1], key: GENRES[i][0], sect: 'GÉNEROS', kind: 'genre' });
    }
    tabs.push({ id: 'g_rel', label: 'Religioso', sect: 'GÉNEROS', kind: 'religious' });
    state.tabs = tabs;

    var all = window.CHANNELS || [];
    for (i = 0; i < all.length; i++) state.byUrl[all[i].url] = all[i];
  }

  function curatedFor(tab) {
    var all = window.CHANNELS || [], out = [], i, g;
    if (tab.kind === 'country') {
      if (tab.key !== 'co') return [];
      return all.slice();
    }
    if (tab.kind === 'genre') {
      for (i = 0; i < all.length; i++) {
        g = CURATED_GENRE[trim(all[i].group)];
        if (g === tab.key) out.push(all[i]);
      }
      return out;
    }
    if (tab.kind === 'religious') {
      for (i = 0; i < all.length; i++) if (trim(all[i].group) === 'Religioso') out.push(all[i]);
      return out;
    }
    return [];
  }

  function favList() {
    var out = [], k;
    for (k in state.favs) if (state.favs[k] && state.byUrl[k]) out.push(state.byUrl[k]);
    return out;
  }

  function merge(base, extra) {
    var seen = {}, out = [], i, c;
    for (i = 0; i < base.length; i++) { c = base[i]; if (!seen[c.url]) { seen[c.url] = 1; out.push(c); } }
    for (i = 0; i < extra.length; i++) { c = extra[i]; if (c.url && !seen[c.url]) { seen[c.url] = 1; out.push(c); } }
    return out;
  }

  /* ---------------- render ---------------- */
  function renderTabs() {
    var html = '', i, t, lastSect = null, n;
    for (i = 0; i < state.tabs.length; i++) {
      t = state.tabs[i];
      if (t.sect !== lastSect) { html += '<div class="sect">' + esc(t.sect) + '</div>'; lastSect = t.sect; }
      n = state.counts[t.id];
      html += '<div class="tab' + (i === state.tab ? ' on' : '') +
              ((state.zone === 'side' || state.zone === 'tabs') && i === state.tab ? ' focus' : '') + '">' +
              esc(t.label) + (n ? '<span class="n">' + n + '</span>' : '') + '</div>';
    }
    tabsEl.innerHTML = html;
  }

  function layout() {
    var w = grid.clientWidth - 68;
    var cols = Math.floor(w / 296);
    if (cols < 1) cols = 1;
    if (cols > 6) cols = 6;
    state.cols = cols;
    state.cardW = Math.floor(w / cols) - 12;
  }

  function setHeader(t) {
    titleEl.textContent = t.label;
    countEl.textContent = '';
  }

  function renderGrid() {
    var html = '', i, c, cls, txt, n = state.view.length, limit = Math.min(n, MAX_RENDER);
    if (!n) {
      grid.innerHTML = '<div class="empty">' + (state.tabs[state.tab].kind === 'fav'
        ? 'Todavía no marcaste favoritos.<br>Pulsa VERDE sobre un canal.'
        : 'Sin canales acá.') + '</div>';
      setHeader(state.tabs[state.tab]);
      return;
    }
    for (i = 0; i < limit; i++) {
      c = state.view[i];
      cls = 'card' + (state.zone === 'grid' && i === state.index ? ' focus' : '') + (state.favs[c.url] ? ' is-fav' : '');
      txt = '<span class="txt"><span class="nm">' + esc(c.name) + '</span>' +
            '<span class="gr">' + esc(c.group || '') + '</span></span>';
      if (c.logo && !c.remote) {
        html += '<div class="' + cls + '" style="width:' + state.cardW + 'px">' +
          '<img class="logo" src="' + esc(c.logo) + '" onerror="this.style.visibility=\'hidden\'">' +
          txt + '<span class="fav">★</span></div>';
      } else {
        html += '<div class="' + cls + '" style="width:' + state.cardW + 'px">' +
          '<span class="ph">' + esc(initial(c.name)) + '</span>' + txt + '<span class="fav">★</span></div>';
      }
    }
    grid.innerHTML = html;
    grid.scrollTop = 0;
    paintFocus();
    setHeader(state.tabs[state.tab]);
    countEl.textContent = (n > limit ? n + ' canales · ' + limit + ' visibles' : n + ' canales');
  }

  function paintFocus() {
    var kids = grid.children, i, el;
    for (i = 0; i < kids.length; i++) {
      el = kids[i];
      if (!el.className || el.className.indexOf('card') !== 0) continue;
      el.className = el.className.replace(/\s*focus/g, '') + (state.zone === 'grid' && i === state.index ? ' focus' : '');
    }
    if (state.zone === 'grid') revealCard(); else revealTab();
  }

  function revealCard() {
    var el = grid.children[state.index];
    if (!el) return;
    if (state.web) {
      var r = el.getBoundingClientRect();
      var h = window.innerHeight || 720;
      if (r.top < 96) window.scrollTo(0, (window.pageYOffset || 0) + r.top - 104);
      else if (r.bottom > h - 24) window.scrollTo(0, (window.pageYOffset || 0) + r.bottom - h + 40);
      return;
    }
    var et = el.offsetTop, eb = et + el.offsetHeight;
    var st = grid.scrollTop, vh = grid.clientHeight;
    if (et < st + 4) grid.scrollTop = et - 8;
    else if (eb > st + vh - 4) grid.scrollTop = eb - vh + 14;
  }

  function revealTab() {
    if (state.web) { window.scrollTo(0, 0); return; }
    var i, idx = 0, found = null;
    for (i = 0; i < tabsEl.children.length; i++) {
      if (tabsEl.children[i].className.indexOf('tab') === 0) {
        if (idx === state.tab) { found = tabsEl.children[i]; break; }
        idx++;
      }
    }
    if (!found) return;
    var top = found.offsetTop, bot = top + found.offsetHeight;
    var st = tabsEl.scrollTop, vh = tabsEl.clientHeight;
    if (top < st + 4) tabsEl.scrollTop = top - 12;
    else if (bot > st + vh - 4) tabsEl.scrollTop = bot - vh + 12;
  }

  /* ---------------- seleccion ---------------- */
  function selectTab(i) {
    if (i < 0 || i >= state.tabs.length) return;
    state.tab = i;
    state.index = 0;
    state.view = [];
    renderTabs();
    var tab = state.tabs[i];
    setStatus('');

    if (tab.kind === 'fav') {
      state.view = favList();
      renderGrid();
      revealTab();
      return;
    }

    var base = curatedFor(tab);
    var url = remoteUrl(tab);

    if (!url) {
      state.view = base;
      state.counts[tab.id] = base.length;
      renderGrid();
      renderTabs();
      revealTab();
      return;
    }

    if (base.length) {
      state.view = base;
      state.counts[tab.id] = base.length;
      renderGrid();
    } else {
      grid.innerHTML = '<div class="empty"><span class="spinner"></span>Cargando ' + esc(tab.label) + '…</div>';
      setHeader(tab);
    }
    setStatus('actualizando…');
    revealTab();

    var mine = state.tab;
    loadRemote(tab, false, function (remote) {
      if (state.tab !== mine) return;
      var k;
      for (k = 0; k < remote.length; k++) state.byUrl[remote[k].url] = remote[k];
      state.view = merge(base, remote);
      state.counts[tab.id] = state.view.length;
      setStatus('');
      renderGrid();
      renderTabs();
      revealTab();
    });
  }

  function refreshCurrent() {
    var tab = state.tabs[state.tab];
    if (!remoteUrl(tab)) { setStatus('lista local'); return; }
    setStatus('actualizando…');
    grid.innerHTML = '<div class="empty"><span class="spinner"></span>Actualizando ' + esc(tab.label) + '…</div>';
    loadRemote(tab, true, function (remote) {
      var k;
      for (k = 0; k < remote.length; k++) state.byUrl[remote[k].url] = remote[k];
      state.view = merge(curatedFor(tab), remote);
      state.counts[tab.id] = state.view.length;
      setStatus('');
      renderGrid();
      renderTabs();
    });
  }

  /* ---------------- navegacion ---------------- */
  function move(d) {
    var n = state.view.length;
    if (!n) return;
    var i = state.index, c = state.cols;
    if (d === 'left' && i % c !== 0) i = i - 1;
    else if (d === 'right' && i % c !== c - 1 && i !== n - 1) i = i + 1;
    else if (d === 'up' && i - c >= 0) i = i - c;
    else if (d === 'down') {
      var nxt = i + c;
      if (nxt < n) i = nxt;
      else {
        var rows = Math.floor((n - 1) / c);
        if (Math.floor(i / c) < rows) i = Math.min(rows * c + (i % c), n - 1);
      }
    }
    if (i !== state.index) { state.index = i; paintFocus(); }
  }

  function toggleFav() {
    var c = state.view[state.index];
    if (!c) return;
    if (state.favs[c.url]) delete state.favs[c.url]; else state.favs[c.url] = 1;
    saveFavs();
    state.counts['fav'] = favList().length;
    renderGrid();
    renderTabs();
  }

  /* ---------------- player ---------------- */
  var variantCache = {};

  /* elige la mejor variante <=720p; la TV es 720p y tiene 1 GB de RAM */
  function pickVariants(text) {
    var lines = String(text).split(/\r?\n/), i, j, l, t2, bw, h, uri, cands = [], pool = [], best, count;
    for (i = 0; i < lines.length; i++) {
      l = trim(lines[i]);
      if (l.indexOf('#EXT-X-STREAM-INF') !== 0) continue;
      bw = parseInt((l.match(/BANDWIDTH=(\d+)/) || [])[1] || '0', 10);
      h = parseInt((l.match(/RESOLUTION=\d+x(\d+)/) || [])[1] || '0', 10);
      uri = null;
      for (j = i + 1; j < lines.length; j++) {
        t2 = trim(lines[j]);
        if (t2 && t2.charAt(0) !== '#') { uri = t2; break; }
      }
      if (uri) cands.push({ bw: bw, h: h, uri: uri });
    }
    if (!cands.length) return null;
    count = cands.length;
    for (i = 0; i < cands.length; i++) if (!cands[i].h || cands[i].h <= 720) pool.push(cands[i]);
    if (!pool.length) pool = cands.slice();
    best = pool[0];
    for (i = 1; i < pool.length; i++) if (pool[i].bw > best.bw) best = pool[i];
    return { best: best.uri, count: count };
  }

  function absolutize(rel, base) {
    if (/^https?:/i.test(rel)) return rel;
    try { return new URL(rel, base).href; } catch (e) {}
    var cut = base.lastIndexOf('/');
    return cut > 8 ? base.substring(0, cut + 1) + rel : rel;
  }

  function attach(ch, url) {
    video.pause();
    try { video.removeAttribute('src'); video.load(); } catch (e) {}
    video.src = url;
    var pr = video.play();
    if (pr && pr['catch']) pr['catch'](function () {});

    if (state.guardTimer) clearTimeout(state.guardTimer);
    state.guardTimer = setTimeout(function () {
      if (state.playing && video.readyState < 2) retryNext('El canal no responde.');
    }, 9000);

    video.onplaying = function () {
      if (state.guardTimer) clearTimeout(state.guardTimer);
      if (!state.playing) return;
      var q = video.videoWidth ? '  ·  ' + video.videoWidth + 'x' + video.videoHeight : '';
      showOsd(state.playing.name, (state.playing.group || '') + q);
    };
    video.onwaiting = function () {
      if (state.playing) showOsd(state.playing.name, 'buffering…');
    };
    video.onerror = function () { retryNext('El canal no está disponible.'); };
  }

  function beginStream(ch) {
    var url = ch.url, cached = variantCache[url];
    /* intento 0: variante <=720p · intento 1: master original (la TV decide) */
    if (state.attempt > 0 || !/\.m3u8(\?|$)/i.test(url)) { attach(ch, url); return; }
    if (cached) { attach(ch, cached.best); return; }
    xhrGet(url, 5000, function (txt) {
      if (state.playing !== ch) return;
      var v = txt ? pickVariants(txt) : null;
      if (v && v.count > 1) {
        variantCache[url] = { best: absolutize(v.best, url) };
        attach(ch, variantCache[url].best);
      } else {
        attach(ch, url);
      }
    });
  }

  function retryNext(msg) {
    if (state.playing && state.attempt === 0) {
      state.attempt = 1;
      showOsd(state.playing.name, 'reintentando con el stream original');
      beginStream(state.playing);
      return;
    }
    fail(msg || 'El canal no está disponible.');
  }

  function showOsd(text, sub) {
    osdName.textContent = text;
    osdState.textContent = sub || '';
    osd.className = '';
    if (state.osdTimer) clearTimeout(state.osdTimer);
    state.osdTimer = setTimeout(function () { osd.className = 'fade'; }, 4500);
  }

  function fail(msg) {
    if (state.guardTimer) clearTimeout(state.guardTimer);
    perrText.textContent = msg;
    perr.className = '';
    showOsd(state.playing ? state.playing.name : '', 'sin señal');
  }

  function play(ch) {
    if (!ch) return;
    state.playing = ch;
    state.attempt = 0;
    perr.className = 'hidden';
    player.className = '';
    if (state.web) document.body.style.overflow = 'hidden';
    showOsd(ch.name, (ch.group || '') + '  ·  conectando');
    beginStream(ch);
  }

  function stopPlayer() {
    state.playing = null;
    if (state.guardTimer) clearTimeout(state.guardTimer);
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
    player.className = 'hidden';
    if (state.web) document.body.style.overflow = '';
  }

  function zap(dir) {
    var n = state.view.length;
    if (!n) return;
    state.index = (state.index + dir + n) % n;
    paintFocus();
    play(state.view[state.index]);
  }

  /* ---------------- teclado ---------------- */
  function onGridClick(e) {
    var el = e.target, kids = grid.children, i;
    while (el && el !== grid) {
      if (el.className && String(el.className).indexOf('card') === 0) break;
      el = el.parentNode;
    }
    if (!el || el === grid) return;
    for (i = 0; i < kids.length; i++) {
      if (kids[i] === el) { state.index = i; play(state.view[i]); return; }
    }
  }

  function onKey(e) {
    var k = e.keyCode || e.which;
    window.__lastKey = k;
    var inPlayer = player.className.indexOf('hidden') === -1;

    if (k === 461 || k === 8 || k === 27 || k === 4) {
      e.preventDefault();
      if (inPlayer) { stopPlayer(); return; }
      if (state.zone === 'side') { state.zone = 'grid'; renderTabs(); paintFocus(); return; }
      return;
    }

    if (inPlayer) {
      if (k === 13) {
        e.preventDefault();
        if (perr.className.indexOf('hidden') === -1) play(state.playing);
        else osd.className = osd.className === 'fade' ? '' : 'fade';
        return;
      }
      if (k === 33) { zap(-1); return; }
      if (k === 34) { zap(1); return; }
      if (k === 19 || k === 415) {
        if (video.paused) video.play(); else video.pause();
        showOsd(state.playing ? state.playing.name : '', video.paused ? 'pausa' : '');
        return;
      }
      if (k === 40 || k === 38) {
        showOsd(state.playing ? state.playing.name : '', (state.playing && state.playing.group) || '');
        return;
      }
      return;
    }

    /* modo navegador con cursor: no secuestramos las flechas */
    if (state.web && !state.tv) return;

    /* modo control remoto (D-pad) servido por web */
    if (state.tv) {
      if (state.zone === 'tabs') {
        if (k === 37) { e.preventDefault(); selectTab(state.tab - 1); return; }
        if (k === 39) { e.preventDefault(); selectTab(state.tab + 1); return; }
        if (k === 40 || k === 13) { e.preventDefault(); state.zone = 'grid'; renderTabs(); paintFocus(); return; }
        return;
      }
      if (k === 37) { e.preventDefault(); move('left'); return; }
      if (k === 39) { e.preventDefault(); move('right'); return; }
      if (k === 38) {
        e.preventDefault();
        if (state.index < state.cols) { state.zone = 'tabs'; renderTabs(); paintFocus(); }
        else move('up');
        return;
      }
      if (k === 40) { e.preventDefault(); move('down'); return; }
      if (k === 13) { e.preventDefault(); if (state.view.length) play(state.view[state.index]); return; }
      if (k === 404) { toggleFav(); return; }
      if (k === 406) { refreshCurrent(); return; }
      return;
    }

    if (state.zone === 'side') {
      if (k === 38) { e.preventDefault(); selectTab(state.tab - 1); return; }
      if (k === 40) { e.preventDefault(); selectTab(state.tab + 1); return; }
      if (k === 39 || k === 13) { e.preventDefault(); state.zone = 'grid'; renderTabs(); paintFocus(); return; }
      if (k === 406) { refreshCurrent(); return; }
      return;
    }

    if (k === 37) {
      e.preventDefault();
      if (state.index % state.cols === 0) { state.zone = 'side'; renderTabs(); paintFocus(); }
      else move('left');
      return;
    }
    if (k === 39) { e.preventDefault(); move('right'); return; }
    if (k === 38) { e.preventDefault(); move('up'); return; }
    if (k === 40) { e.preventDefault(); move('down'); return; }
    if (k === 13) { e.preventDefault(); if (state.view.length) play(state.view[state.index]); return; }
    if (k === 33) { selectTab(state.tab - 1); return; }
    if (k === 34) { selectTab(state.tab + 1); return; }
    if (k === 404) { toggleFav(); return; }
    if (k === 406) { refreshCurrent(); return; }
    if (k === 405) { state.index = 0; paintFocus(); return; }
    if (k >= 48 && k <= 57) {
      var d = k - 48, i = d === 0 ? 9 : d - 1;
      if (i < state.view.length) { state.index = i; paintFocus(); }
      return;
    }
  }

  /* ---------------- arranque ---------------- */
  function clock() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    $('clock').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function seedFavs() {
    if (localStorage.getItem('iptv.seeded') === '1') return;
    var all = window.CHANNELS || [], keys = ['caracol', 'rcn hd2', 'canal 1', 'senal colombia', 'citytv', 'teleantioquia', 'ntn24', 'win sports'], i, j, n, hit;
    for (i = 0; i < keys.length; i++) {
      hit = null;
      for (j = 0; j < all.length; j++) {
        n = (all[j].name || '').toLowerCase();
        if (n.indexOf(keys[i]) !== -1) { hit = all[j]; break; }
      }
      if (hit) state.favs[hit.url] = 1;
    }
    saveFavs();
    try { localStorage.setItem('iptv.seeded', '1'); } catch (e) {}
  }

  function boot() {
    loadFavs();
    seedFavs();
    clock();
    setInterval(clock, 20000);
    document.addEventListener('keydown', onKey);

    if (state.web) {
        document.body.className = 'web';
        grid.addEventListener('click', onGridClick);
    }

    buildTabs();
    layout();
    state.counts['fav'] = favList().length;
    renderTabs();

    var start = 0, i;
    for (i = 0; i < state.tabs.length; i++) if (state.tabs[i].id === 'c_co') start = i;
    selectTab(start);
  }

  window.__dbg = { play: play, pick: pickVariants, begin: beginStream, src: function () { return video.src; } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
