name: Tracer

# Compila Tracer.dylib (diagnostico de recoil) sin Mac, igual que ESP/KeyGate.
# Es C puro en archivos .m + un .s con los detours en asm; no usa ObjC/ARC.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Tracer/Tracer.h'
      - 'Tracer/Hook.h'
      - 'Tracer/Hook.m'
      - 'Tracer/Tracer.m'
      - 'Tracer/Detours.s'
      - '.github/workflows/tracer.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Compilar Tracer.dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          clang -dynamiclib \
                -arch arm64 \
                -isysroot "$SDK" \
                -miphoneos-version-min=15.0 \
                -Wall \
                -framework Foundation \
                -o Tracer.dylib \
                Tracer/Tracer.m \
                Tracer/Hook.m \
                Tracer/Detours.s
          echo "compilado"

      - name: Verificar que es una dylib arm64 con constructor
        run: |
          set -e
          echo "--- file ---"; file Tracer.dylib
          echo "--- arch ---";  lipo -info Tracer.dylib

          echo "--- simbolos ---"
          fail=0
          for s in tracer_log tracer_detour_0 tracer_detour_1 tracer_detour_2 tracer_detour_3 tracer_detour_4; do
            if nm -gU Tracer.dylib | grep -q " T _$s"; then echo "  ok     _$s"; else echo "  FALTA  _$s"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || { echo "FALTAN SIMBOLOS"; exit 1; }

          echo "--- constructor (__init_offsets) ---"
          INITSZ=$(otool -l Tracer.dylib | awk '/sectname __init_offsets/{f=1} f&&/^ *size/{print $2; exit}')
          if [ -n "$INITSZ" ] && [ $((INITSZ)) -gt 0 ]; then
            echo "  ok     __init_offsets = $INITSZ"
          else
            echo "  FALTA  sin __init_offsets: cargaria y no engancharia nada"; exit 1
          fi

          file Tracer.dylib | grep -q 'arm64'  || { echo "NO es arm64"; exit 1; }
          file Tracer.dylib | grep -q 'shared' || { echo "NO es shared library"; exit 1; }
          echo "OK: dylib arm64 con constructor y simbolos presentes"

      - name: Subir el resultado
        uses: actions/upload-artifact@v4
        with:
          name: Tracer
          path: Tracer.dylib
          if-no-files-found: error
