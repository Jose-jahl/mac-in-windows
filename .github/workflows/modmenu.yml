name: ModMenu

# Copia CANONICA del workflow que compila la dylib. Vive en FUSION para que el
# contrato este versionado con el codigo; el CI real lo ejecuta desde
# Jose-jahl/mac-in-windows (.github/workflows/modmenu.yml). Ver ci/README.md.
#
# 0.12: ademas del .dylib, el artefacto lleva provenance.json con el commit
# COMPLETO, el hash del workflow, el hash del fuente y el sha256 del binario.
# `fusion build --fetch` lo cruza contra la API de GitHub y `fusion promote`
# se niega a promover sin ese registro.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ModMenu/**'
      - '.github/workflows/modmenu.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Compilar ModMenu.dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          # -fobjc-arc es obligatorio: el fuente usa bloques y ARC.
          # install_name = el del framework que reemplazamos: si algo mira la
          # identidad del binario en runtime, ve la ruta que espera el juego.
          clang -dynamiclib \
                -arch arm64 \
                -isysroot "$SDK" \
                -miphoneos-version-min=15.0 \
                -fobjc-arc \
                -Wall \
                -install_name "@rpath/MSDKPolicy.framework/MSDKPolicy" \
                -framework UIKit \
                -framework Foundation \
                -framework QuartzCore \
                -framework CoreGraphics \
                -framework Security \
                -o ModMenu.dylib \
                ModMenu/ModMenu.m
          echo "compilado"

      - name: Verificar que es una dylib arm64 con constructor
        run: |
          set -e
          echo "--- file ---"
          file ModMenu.dylib
          echo
          echo "--- install name ---"
          otool -D ModMenu.dylib
          otool -D ModMenu.dylib | grep -q '@rpath/MSDKPolicy.framework/MSDKPolicy' \
            || { echo "install name incorrecto"; exit 1; }
          echo
          echo "--- simbolo marcador ---"
          nm -gU ModMenu.dylib | grep -q '_modmenu_build_id' \
            || { echo "FALTA _modmenu_build_id: el fuente no llego al binario"; exit 1; }
          echo "  ok      _modmenu_build_id"
          echo
          echo "--- constructor ---"
          # Igual que en ESP: los punteros de constructor van en
          # __TEXT,__init_offsets (no hay __mod_init_func con Xcode nuevo).
          INITSZ=$(otool -l ModMenu.dylib | awk '/sectname __init_offsets/{f=1} f&&/^ *size/{print $2; exit}')
          if [ -n "$INITSZ" ] && [ $((INITSZ)) -gt 0 ]; then
            echo "  ok      __init_offsets = $INITSZ B (hay constructor)"
          else
            echo "  FALTA   sin __init_offsets: la dylib cargaria y no haria nada"
            otool -l ModMenu.dylib | grep -iE 'sectname|segname' | grep -i init || true
            exit 1
          fi
          echo
          echo "--- tamano ---"
          ls -l ModMenu.dylib
          file ModMenu.dylib | grep -q 'arm64'  || { echo "NO es arm64"; exit 1; }
          file ModMenu.dylib | grep -q 'shared' || { echo "NO es una libreria compartida"; exit 1; }
          echo
          echo "OK: ModMenu.dylib lista para el swap"

      - name: Provenance del artefacto (0.12)
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SERVER: ${{ github.server_url }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -e
          python3 - <<'PY'
          import hashlib, json, os, re

          def sha(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest().upper()

          raw = open('ModMenu.dylib', 'rb').read()
          marker = re.search(rb'modmenu-glass-[0-9.]+', raw)
          prov = {
              'schema': 1,
              'repo': os.environ['REPO'],
              'workflow': 'modmenu.yml',
              'workflow_ref': os.environ.get('WORKFLOW_REF'),
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'event': os.environ['EVENT'],
              'head_sha': os.environ['HEAD_SHA'],
              'head_branch': os.environ['HEAD_BRANCH'],
              'actor': os.environ['ACTOR'],
              'url': os.environ['SERVER'] + '/' + os.environ['REPO'] + '/actions/runs/' + os.environ['RUN_ID'],
              'dylib_sha256': sha('ModMenu.dylib'),
              'source_sha256': sha('ModMenu/ModMenu.m'),
              'workflow_sha256': sha('.github/workflows/modmenu.yml'),
              'build_id': marker.group(0).decode() if marker else None,
          }
          with open('provenance.json', 'w') as f:
              json.dump(prov, f, indent=2)
              f.write('\n')
          print(json.dumps(prov, indent=2))
          PY

      - name: Archivar provenance en el resumen del run
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat provenance.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el resultado
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu
          path: |
            ModMenu.dylib
            provenance.json
          if-no-files-found: error
