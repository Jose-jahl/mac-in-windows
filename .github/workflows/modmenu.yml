name: ModMenu

# Copia CANONICA del workflow que compila la dylib. Vive en FUSION para que el
# contrato este versionado con el codigo; el CI real lo ejecuta desde
# Jose-jahl/mac-in-windows (.github/workflows/modmenu.yml). Ver ci/README.md.
#
# 0.12: ademas del .dylib, el artefacto lleva provenance.json con el commit
# COMPLETO, el hash del workflow, el hash del fuente y el sha256 del binario.
# `fusion build --fetch` lo cruza contra la API de GitHub y `fusion promote`
# se niega a promover sin ese registro.
#
# 0.13 (ADR 0006 - Fase B): soporte OPCIONAL para linkear Dobby estatico.
# Push normal a main compila sin Dobby (comportamiento igual a 0.12).
# workflow_dispatch con enable_dobby=true clona + buildea + linkea Dobby
# y define MM_USE_DOBBY=1 para activar el bloque de hooking en el fuente.

on:
  workflow_dispatch:
    inputs:
      enable_dobby:
        description: 'Buildear Dobby static y linkear (gated por MM_USE_DOBBY)'
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    paths:
      - 'ModMenu/**'
      - '.github/workflows/modmenu.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Clone + build Dobby (opcional, solo si enable_dobby=true)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.enable_dobby == 'true'
        run: |
          set -e
          git clone --depth 1 https://github.com/jmpews/Dobby.git vendor/dobby
          cd vendor/dobby
          mkdir -p build && cd build
          # iOS arm64, static library.
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DDOBBY_BUILD_SHARED_LIBRARY=OFF \
            -DDOBBY_BUILD_STATIC_LIBRARY=ON \
            -DDOBBY_GENERATE_SYMBOLS=OFF
          cmake --build . --config Release --target dobby_static
          # Localizar el .a (Xcode genera en Release-iphoneos/)
          find . -name 'libdobby.a' | head -1
          echo "DOBBY_LIB=$(find "$(pwd)" -name 'libdobby.a' | head -1)" >> "$GITHUB_ENV"
          echo "DOBBY_INC=${{ github.workspace }}/vendor/dobby/include" >> "$GITHUB_ENV"

      - name: Compilar ModMenu.dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          # Flags base. -fobjc-arc obligatorio (ARC + bloques en el fuente).
          # install_name = framework que reemplazamos (identidad en runtime).
          EXTRA_INCS=""
          EXTRA_LIBS=""
          EXTRA_DEFS=""
          if [ -n "$DOBBY_LIB" ] && [ -f "$DOBBY_LIB" ]; then
            echo "Linkeando Dobby desde $DOBBY_LIB"
            EXTRA_INCS="-I$DOBBY_INC"
            EXTRA_LIBS="$DOBBY_LIB -lc++"
            EXTRA_DEFS="-DMM_USE_DOBBY=1"
          else
            echo "Build sin Dobby (MM_USE_DOBBY no definido)"
          fi
          # -Oz: optimizar por tamano (el dylib viaja dentro del IPA).
          # -Wl,-dead_strip: el linker tira el codigo muerto (probe BR, arrays
          # del skeleton) en vez de dejarlo en __text.
          clang -dynamiclib \
                -arch arm64 \
                -isysroot "$SDK" \
                -miphoneos-version-min=15.0 \
                -fobjc-arc \
                -Wall \
                -Oz \
                -Wl,-dead_strip \
                $EXTRA_INCS \
                $EXTRA_DEFS \
                -install_name "@rpath/MSDKPolicy.framework/MSDKPolicy" \
                -framework UIKit \
                -framework Foundation \
                -framework QuartzCore \
                -framework CoreGraphics \
                -framework Security \
                -o ModMenu.dylib \
                ModMenu/ModMenu.m \
                $EXTRA_LIBS
          echo "compilado"

      - name: Verificar que es una dylib arm64 con constructor
        run: |
          set -e
          echo "--- file ---"
          file ModMenu.dylib
          echo
          echo "--- install name ---"
          otool -D ModMenu.dylib
          otool -D ModMenu.dylib | grep -q '@rpath/MSDKPolicy.framework/MSDKPolicy' \
            || { echo "install name incorrecto"; exit 1; }
          echo
          echo "--- simbolo marcador ---"
          nm -gU ModMenu.dylib | grep -q '_modmenu_build_id' \
            || { echo "FALTA _modmenu_build_id: el fuente no llego al binario"; exit 1; }
          echo "  ok      _modmenu_build_id"
          echo
          echo "--- constructor ---"
          # Igual que en ESP: los punteros de constructor van en
          # __TEXT,__init_offsets (no hay __mod_init_func con Xcode nuevo).
          INITSZ=$(otool -l ModMenu.dylib | awk '/sectname __init_offsets/{f=1} f&&/^ *size/{print $2; exit}')
          if [ -n "$INITSZ" ] && [ $((INITSZ)) -gt 0 ]; then
            echo "  ok      __init_offsets = $INITSZ B (hay constructor)"
          else
            echo "  FALTA   sin __init_offsets: la dylib cargaria y no haria nada"
            otool -l ModMenu.dylib | grep -iE 'sectname|segname' | grep -i init || true
            exit 1
          fi
          echo
          echo "--- tamano ---"
          ls -l ModMenu.dylib
          file ModMenu.dylib | grep -q 'arm64'  || { echo "NO es arm64"; exit 1; }
          file ModMenu.dylib | grep -q 'shared' || { echo "NO es una libreria compartida"; exit 1; }
          echo
          echo "OK: ModMenu.dylib lista para el swap"

      - name: Provenance del artefacto (0.12)
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SERVER: ${{ github.server_url }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -e
          python3 - <<'PY'
          import hashlib, json, os, re

          def sha(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest().upper()

          raw = open('ModMenu.dylib', 'rb').read()
          marker = re.search(rb'modmenu-glass-[0-9.]+', raw)
          prov = {
              'schema': 1,
              'repo': os.environ['REPO'],
              'workflow': 'modmenu.yml',
              'workflow_ref': os.environ.get('WORKFLOW_REF'),
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'event': os.environ['EVENT'],
              'head_sha': os.environ['HEAD_SHA'],
              'head_branch': os.environ['HEAD_BRANCH'],
              'actor': os.environ['ACTOR'],
              'url': os.environ['SERVER'] + '/' + os.environ['REPO'] + '/actions/runs/' + os.environ['RUN_ID'],
              'dylib_sha256': sha('ModMenu.dylib'),
              'source_sha256': sha('ModMenu/ModMenu.m'),
              'workflow_sha256': sha('.github/workflows/modmenu.yml'),
              'build_id': marker.group(0).decode() if marker else None,
          }
          with open('provenance.json', 'w') as f:
              json.dump(prov, f, indent=2)
              f.write('\n')
          print(json.dumps(prov, indent=2))
          PY

      - name: Archivar provenance en el resumen del run
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat provenance.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el resultado
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu
          path: |
            ModMenu.dylib
            provenance.json
          if-no-files-found: error
